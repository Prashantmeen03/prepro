[build]
  base = "."
  command = "npm run build"
  publish = "Frontend/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdf-parse", "mammoth"]
  included_files = ["node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs"]

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8889

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
